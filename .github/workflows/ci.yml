name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 서로 기다릴 필요 없는 검사는 작업을 나눠 동시에 돌립니다.
# - 린트·타입·단위 테스트, 스토리 테스트, 빌드·용량은 바로 시작
# - E2E(쇼핑몰·어드민)와 Lighthouse는 빌드 작업의 결과물을 받아 동시에 실행
# 문서(Markdown)만 바뀐 변경은 스토리 테스트·E2E·Lighthouse를 건너뜁니다.

env:
  # E2E에서 쇼핑몰의 /admin을 로컬 어드민 서버(3102)로 넘기도록 빌드합니다.
  ADMIN_ORIGIN: http://localhost:3102

jobs:
  changes:
    name: 바뀐 파일 분류
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 비교할 커밋이 없으면(새 브랜치 등) 전체 검사
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$GITHUB_SHA")
          echo "$files"
          # Markdown이 아닌 파일(코드·설정·데이터·이미지)이 하나라도 있으면 전체 검사
          if [ -z "$files" ] || echo "$files" | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint · Format · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # ESLint(Next.js 규칙, import 정렬) + FSD 규칙(Steiger)
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # 단위·컴포넌트 테스트와 커버리지 하한(패키지마다 vitest.config.ts의 coverage.thresholds)
      - run: pnpm test:coverage

  storybook:
    name: Storybook
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @snb/shop exec playwright install --with-deps chromium
      # 모든 스토리를 실제 브라우저(Chromium)에서 렌더링하고 접근성 검사(axe)까지 실행
      - run: pnpm test:storybook

  build:
    name: Build · Size
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Storybook(public/storybook)을 포함한 프로덕션 빌드
      - run: pnpm build
      # 쇼핑몰의 번들 크기
      - run: pnpm --filter @snb/shop size
      # E2E·Lighthouse 작업이 같은 빌드를 쓰도록 결과물을 넘깁니다(캐시는 빼고 파일 하나로).
      - if: needs.changes.outputs.code == 'true'
        run: >-
          tar -cf build.tar --exclude='.next/cache'
          apps/shop/.next apps/admin/.next apps/shop/public/storybook apps/admin/public/storybook
      - if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tar
          retention-days: 1

  e2e-shop:
    name: E2E (쇼핑몰)
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xf build.tar && rm build.tar
      - run: pnpm --filter @snb/shop exec playwright install --with-deps chromium
      # 프로덕션 빌드(next start)에서 업무 흐름, 접근성(axe), 화면 넘침을 검사
      - run: pnpm --filter @snb/shop e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports-shop
          path: |
            apps/shop/playwright-report/
            apps/shop/test-results/
          retention-days: 7

  e2e-admin:
    name: E2E (어드민)
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xf build.tar && rm build.tar
      - run: pnpm --filter @snb/shop exec playwright install --with-deps chromium
      - run: pnpm --filter @snb/admin e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports-admin
          path: |
            apps/admin/playwright-report/
            apps/admin/test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xf build.tar && rm build.tar
      # 쇼핑몰 주요 화면의 Lighthouse 점수(apps/shop/lighthouserc.json)
      - run: pnpm --filter @snb/shop lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports-lighthouse
          # .lighthouseci는 숨김 폴더라 따로 켜야 올라갑니다.
          include-hidden-files: true
          path: apps/shop/.lighthouseci/
          retention-days: 7
